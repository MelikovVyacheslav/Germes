plugins {
    id 'io.spring.dependency-management' version '1.1.0'
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'org'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    jacksonVersion = '2.19.2'
    springVersion = '7.0.0-M5'
    bouncycastleVersion = '1.70'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation("com.fasterxml.jackson.core:jackson-databind:$jacksonVersion")
    implementation("com.fasterxml.jackson.core:jackson-core:$jacksonVersion")
    implementation("com.fasterxml.jackson.core:jackson-annotations:$jacksonVersion")

    implementation("com.zaxxer:HikariCP:7.0.0")
    implementation("org.springframework.boot:spring-boot-starter:4.0.0-M1")
    implementation("org.springframework.boot:spring-boot-starter-jdbc:4.0.0-M1")
    implementation("org.springframework.boot:spring-boot-starter-webflux:4.0.0-M1")
    implementation("mysql:mysql-connector-java:8.0.33")
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8")
    implementation("com.github.mwiede:jsch:0.2.11")
    implementation("org.bouncycastle:bcprov-jdk15on:$bouncycastleVersion")
    implementation("org.bouncycastle:bcpkix-jdk15on:$bouncycastleVersion")
    implementation ("org.slf4j:slf4j-api:2.0.12")
    implementation ("ch.qos.logback:logback-classic:1.5.6")
}

jar {
    manifest {
        attributes(
                'Main-Class': 'org.slavik.Main'
        )
    }
}

test {
    useJUnitPlatform()
}

kotlin {
    jvmToolchain(21)
}

// ShadowJar configuration — исправлено!
tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveBaseName.set('u3045843_default')
    archiveClassifier.set('')
    archiveVersion.set('1.0-all')
    manifest {
        attributes(
                'Main-Class': 'org.slavik.Main'
        )
    }
}
